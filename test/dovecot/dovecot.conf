protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
log_path = /dev/stderr
info_log_path = /dev/stderr
# Dovecot REFUSES uid 0 for a mail process regardless of first_valid_uid — it fails with
# "Invalid settings in userdb: userdb returned 0 as uid" AFTER a successful login, so the
# symptom is a mid-session close rather than an auth error. Use a non-root uid; /tmp is 1777 so
# the mail root is still creatable.
first_valid_uid = 1000
mail_uid = 1000
mail_gid = 1000
mail_location = maildir:/tmp/vmail/%u/Maildir
passdb {
  driver = static
  args = password=testpass-password
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/tmp/vmail/%u
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
}
